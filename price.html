<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Lunessa เช็คค่าบริการ</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"/><style>:root{--ivory:#F3EEE7;--ink:#1A1714;--sage:#3E4F44;--card:#FFFCF8;--line:#E6DED4}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Sarabun,sans-serif;line-height:1.55}.wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px}.brand{text-align:center}.brand img{width:168px;height:auto}.brand h1{margin:8px 0 0;letter-spacing:.22em;color:var(--sage);font-weight:700}.brand small{letter-spacing:.28em;font-size:11px;color:#7a726a}.toprow{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.toprow a{color:var(--sage);text-decoration:none}.langs button{border:0;background:transparent;color:#8a8178;font:inherit;padding:0 6px}.langs button.on{color:var(--sage);font-weight:700}h2{font-weight:700;font-size:30px;margin:0 0 6px;color:var(--sage)}.lead{color:#6d655e}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}label{display:block;font-size:13px;margin:10px 0 4px}input,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:#fff}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:inherit}.choices button.on{background:var(--sage);color:#fff}.price{font-size:34px;font-weight:700;color:var(--sage);margin:6px 0}.hint{font-size:13px;color:#6d655e}.btn{display:inline-flex;justify-content:center;border:0;border-radius:999px;padding:13px 18px;font-weight:600;text-decoration:none;background:var(--sage);color:#fff;width:100%}</style></head><body><div class="wrap"><header class="brand"><img src="images/lunessa-logo.png" alt="Lunessa"/><h1>LUNESSA</h1><small>PET BOUTIQUE</small></header><div class="toprow"><a href="index.html">←</a><div class="langs"><button data-lang="th" class="on">TH</button><button data-lang="en">EN</button><button data-lang="zh">中文</button></div></div><h2 id="title">เช็คค่าบริการ</h2><p class="lead" id="lead">กรอกข้อมูลน้อง ราคาที่เห็นเป็นราคาเบื้องต้น ชั่งน้ำหนักจริงที่ร้านได้</p><div class="card"><label id="lpet">หมาหรือแมว</label><div class="choices" id="pets"></div><label id="lcoat">ลักษณะขน</label><div class="choices" id="coats"></div><label id="lweight">น้ำหนัก (กก.)</label><input id="weight" type="number" min="0.1" step="0.1" placeholder="4.2"/><label id="lsvc">บริการ</label><select id="service"></select></div><div class="card"><div id="est">ราคาโดยประมาณ</div><div class="price" id="price">฿0</div><p class="hint" id="band"></p><p class="hint" id="note"></p></div><a class="btn" href="https://lunessaofficialth.github.io/lunessa-booking/?v=16" id="book">จองคิว</a></div><script>
const dog={short:{bath:[259,359,409,459,509],shave:[509,609,659,759,809],groom:[609,709,759,859,909]},medium:{bath:[309,409,459,509,559],shave:[559,659,759,809,909],groom:[659,759,859,909,1009]},long:{bath:[359,459,509,559,609],shave:[659,759,859,909,1009],groom:[759,859,959,1009,1109]}};
const cat={short:{bath:[309,359,409,459,509],shave:[359,459,509,559,609],groom:[709,859,909,959,1009]},long:{bath:[359,459,509,559,609],shave:[609,759,809,859,909],groom:[709,859,909,959,1009]}};
const dogBands=[[0,1.9],[2,3.9],[4,6.4],[6.5,9.9],[10,15]];
const catBands=[[0,1.4],[1.5,2.9],[3,4.4],[4.5,4.9],[5,7]];
const T={th:{title:'เช็คค่าบริการ',lead:'กรอกข้อมูลน้อง ราคาที่เห็นเป็นราคาเบื้องต้น ชั่งน้ำหนักจริงที่ร้านได้',pet:'หมาหรือแมว',coat:'ลักษณะขน',weight:'น้ำหนัก (กก.)',svc:'บริการ',est:'ราคาโดยประมาณ',book:'จองคิว',note:'ราคาจริงยืนยันที่ร้านตามน้ำหนักและสภาพขน',over:'น้ำหนักเกินช่วงตาราง ให้ถามร้านก่อนจอง',pets:[['dog','หมา'],['cat','แมว']],coats:{dog:[['short','ขนสั้น'],['medium','ขนปานกลาง'],['long','ขนยาว']],cat:[['short','ขนสั้น'],['long','ขนยาว']]},svcs:[['bath','อาบน้ำอย่างเดียว'],['shave','อาบน้ำ + ไถขน'],['groom','อาบน้ำ + ตัดขนทรงกรูม']]},en:{title:'Check price',lead:'Enter the pet details. This is a starting price. Final price is confirmed in store.',pet:'Dog or cat',coat:'Coat',weight:'Weight (kg)',svc:'Service',est:'Estimated price',book:'Book',note:'Final price is confirmed by weight and coat at the shop.',over:'Over the table range. Ask the shop before booking.',pets:[['dog','Dog'],['cat','Cat']],coats:{dog:[['short','Short'],['medium','Medium'],['long','Long']],cat:[['short','Short'],['long','Long']]},svcs:[['bath','Bath only'],['shave','Bath + clip'],['groom','Bath + scissor groom']]},zh:{title:'查看价格',lead:'填写宠物资料。这是预估价，最终以到店确认为准。',pet:'狗或猫',coat:'毛发',weight:'体重（公斤）',svc:'服务',est:'预估价格',book:'预约',note:'最终价格以到店称重和毛发状况为准。',over:'超出价目表范围，请先问店里。',pets:[['dog','狗狗'],['cat','猫咪']],coats:{dog:[['short','短毛'],['medium','中长'],['long','长毛']],cat:[['short','短毛'],['long','长毛']]},svcs:[['bath','只洗澡'],['shave','洗澡 + 剑毛'],['groom','洗澡 + 修剪']]}};
let lang='th',pet='dog',coat='short';
function bandOf(w){const bands=pet==='dog'?dogBands:catBands;const i=bands.findIndex(b=>w>=b[0]&&w<=b[1]);return i;}
function draw(){const t=T[lang];document.getElementById('title').textContent=t.title;document.getElementById('lead').textContent=t.lead;document.getElementById('lpet').textContent=t.pet;document.getElementById('lcoat').textContent=t.coat;document.getElementById('lweight').textContent=t.weight;document.getElementById('lsvc').textContent=t.svc;document.getElementById('est').textContent=t.est;document.getElementById('book').textContent=t.book;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));document.getElementById('pets').innerHTML=t.pets.map(p=>'<button type="button" data-pet="'+p[0]+'" class="'+(pet===p[0]?'on':'')+'">'+p[1]+'</button>').join('');document.getElementById('coats').innerHTML=t.coats[pet].map(c=>'<button type="button" data-coat="'+c[0]+'" class="'+(coat===c[0]?'on':'')+'">'+c[1]+'</button>').join('');const sel=document.getElementById('service');const cur=sel.value||'bath';sel.innerHTML=t.svcs.map(s=>'<option value="'+s[0]+'">'+s[1]+'</option>').join('');sel.value=cur;document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{pet=b.dataset.pet;if(pet==='cat'&&coat==='medium')coat='short';draw();});document.querySelectorAll('[data-coat]').forEach(b=>b.onclick=()=>{coat=b.dataset.coat;draw();});calc();}
function calc(){const t=T[lang];const w=Number(document.getElementById('weight').value);const svc=document.getElementById('service').value||'bath';if(!w){document.getElementById('price').textContent='฿0';document.getElementById('band').textContent='';document.getElementById('note').textContent=t.note;return;}const i=bandOf(w);if(i<0){document.getElementById('price').textContent='-';document.getElementById('band').textContent=t.over;document.getElementById('note').textContent=t.note;return;}const table=pet==='dog'?dog:cat;const price=table[coat][svc][i];document.getElementById('price').textContent='฿'+price;document.getElementById('band').textContent=(pet==='dog'?dogBands:catBands)[i].join('–')+' kg';document.getElementById('note').textContent=t.note;}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;draw();});document.getElementById('weight').oninput=calc;document.getElementById('service').onchange=calc;draw();
</script></body></html>
