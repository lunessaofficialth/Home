<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Lunessa เช็คค่าบริการ</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"/><style>:root{--ivory:#F3EEE7;--ink:#1A1714;--sage:#3E4F44;--card:#FFFCF8;--line:#E6DED4}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Sarabun,sans-serif;line-height:1.55}.wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px}.brand{text-align:center}.brand img{width:168px;height:auto}.brand h1{margin:8px 0 0;letter-spacing:.22em;color:var(--sage);font-weight:700}.brand small{letter-spacing:.28em;font-size:11px;color:#7a726a}.toprow{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.toprow a{color:var(--sage);text-decoration:none}.langs button{border:0;background:transparent;color:#8a8178;font:inherit;padding:0 6px}.langs button.on{color:var(--sage);font-weight:700}h2{font-weight:700;font-size:30px;margin:0 0 6px;color:var(--sage)}.lead{color:#6d655e}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}label{display:block;font-size:13px;margin:10px 0 4px}select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:#fff}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:inherit}.choices button.on{background:var(--sage);color:#fff}.price{font-size:34px;font-weight:700;color:var(--sage);margin:6px 0}.price.pending{font-size:20px;color:#9a5b3c}.hint{font-size:13px;color:#6d655e}.btn{display:inline-flex;justify-content:center;border:0;border-radius:999px;padding:13px 18px;font-weight:600;text-decoration:none;background:var(--sage);color:#fff;width:100%}</style></head><body><div class="wrap"><header class="brand"><img src="images/lunessa-logo.png" alt="Lunessa"/><h1>LUNESSA</h1><small>PET BOUTIQUE</small></header><div class="toprow"><a href="index.html">←</a><div class="langs"><button data-lang="th" class="on">TH</button><button data-lang="en">EN</button><button data-lang="zh">中文</button></div></div><h2 id="title">เช็คค่าบริการ</h2><p class="lead" id="lead">เลือกช่วงน้ำหนักที่ใกล้เคียง ราคาที่เห็นเป็นราคาเบื้องต้น ชั่งน้ำหนักจริงที่ร้านได้</p><div class="card"><label id="lpet">หมาหรือแมว</label><div class="choices" id="pets"></div><label id="lcoat">ลักษณะขน</label><div class="choices" id="coats"></div><label id="lweight">น้ำหนัก</label><div class="choices" id="weights"></div><label id="lsvc">บริการ</label><select id="service"></select></div><div class="card"><div id="est">ราคาโดยประมาณ</div><div class="price" id="price">฿0</div><p class="hint" id="note"></p></div>
<div class="card" id="addonsCard"><strong id="addonsTitle">บริการเสริม</strong><p class="hint" id="addonsLead"></p><ul id="addonsList" style="margin:8px 0 0;padding-left:18px"></ul></div>
<a class="btn" href="https://lunessaofficialth.github.io/lunessa-booking/?v=29" id="book">จองคิว</a></div><script>
const dog={short:{bath:[259,359,409,459,509],shave:[509,609,659,759,809],groom:[609,709,759,859,909]},medium:{bath:[309,409,459,509,559],shave:[559,659,759,809,909],groom:[659,759,859,909,1009]},long:{bath:[359,459,509,559,609],shave:[659,759,859,909,1009],groom:[759,859,959,1009,1109]}};
const cat={single:{bath:[309,359,409,459,509]},double:{bath:[359,459,509,559,609],shave:[609,759,809,859,909],groom:[709,859,909,959,1009]}};
const dogBands=['ต่ำกว่า 1–1.9 กก.','2–3.9 กก.','4–6.4 กก.','6.5–9.9 กก.','10–15 กก.'];
const catBands=['ต่ำกว่า 1–1.4 กก.','1.5–2.9 กก.','3–4.4 กก.','4.5–4.9 กก.','5–7 กก.'];
const T={th:{title:'เช็คค่าบริการ',lead:'เลือกช่วงน้ำหนักที่ใกล้เคียง ราคาที่เห็นเป็นราคาเบื้องต้น ชั่งน้ำหนักจริงที่ร้านได้',pet:'หมาหรือแมว',coat:'ลักษณะขน',weight:'น้ำหนัก',svc:'บริการ',est:'ราคาโดยประมาณ',book:'จองคิว',note:'ราคาจริงยืนยันที่ร้านตามน้ำหนักและสภาพขน',pets:[['dog','หมา'],['cat','แมว']],coats:{dog:[['short','ขนสั้น'],['medium','ขนปานกลาง'],['long','ขนยาว']],cat:[['single','ขนสั้นชั้นเดียว (แมวไทย)'],['double','ขนสองชั้น / ขนยาว / ขนสั้นแต่หนา']]},catHint:'ขนสั้นชั้นเดียว = ขนเรียบบางติดตัวแบบแมวไทย (อาบน้ำอย่างเดียว) · ขนสั้นแต่หนา/ฟู ให้เลือกกลุ่มที่สอง (ราคาเท่าขนยาว)',pickCoat:'กรุณาเลือกลักษณะขน',catNote:'ไม่รวมค่าบริการเพิ่ม เช่น แมวดุ ขนพันเป็นสังกะตัง แมวกลัวน้ำหรือกลัวไดร์',bathOnly:'ขนสั้นชั้นเดียวมีเฉพาะอาบน้ำ (ไม่มีไถขน/ตัดกรรไกร)',svcs:[['bath','อาบน้ำอย่างเดียว'],['shave','อาบน้ำ + ไถขน'],['groom','อาบน้ำ + ตัดขนงานกรรไกร']],addonsTitle:'บริการเสริม',addonsLead:'เลือกรายการเสริมได้ ไม่รวมในมัดจำ · ราคาตามรายการ',addons:[['coat','ทรีตเมนต์บำรุงเส้นขน','+฿50','all'],['ear','ล้างหูด้วยน้ำยาทำความสะอาดหู','+฿50','all'],['pluck','ถอนขนหู (หมา)','+฿50','dog'],['mala','อาบแชมพูยา Malaseb','1 จุด +฿50 / ทั้งตัว +฿100','all'],['deg','ขจัดคราบมันสะสมบนเส้นขน (แมว)','1 จุด +฿100 / ทั้งตัว +฿500','cat'],['nail','ตะไบเก็บขอบเล็บ','+฿50','all'],['gland','บีบต่อมเหม็น','+฿30','all'],['sani','ไถขนก้น','ฟรี','all'],['teeth','แปรงฟัน','+฿50','all']]},en:{title:'Check price',lead:'Pick the closest weight band. The shop confirms the final price.',pet:'Dog or cat',coat:'Coat',weight:'Weight',svc:'Service',est:'Estimated price',book:'Book',note:'Final price is confirmed by weight and coat at the shop.',pets:[['dog','Dog'],['cat','Cat']],coats:{dog:[['short','Short'],['medium','Medium'],['long','Long']],cat:[['single','Single-layer short coat (Thai cat)'],['double','Double coat / long hair / short but thick']]},catHint:'Single-layer = a thin, flat coat like a Thai cat (bath only) · Short but thick/fluffy coat: choose the second group (same price as long hair).',pickCoat:'Please choose a coat type',catNote:'Extra charges not included, e.g. aggressive cat, matted coat, fear of water or dryer.',bathOnly:'Single-layer coats are bath only (no clip or scissor cut).',svcs:[['bath','Bath only'],['shave','Bath + clip'],['groom','Bath + scissor cut']],addonsTitle:'Add-ons',addonsLead:'Optional extras, not included in the deposit.',addons:[['coat','Coat conditioning treatment','+฿50','all'],['ear','Deep ear cleansing','+฿50','all'],['pluck','Ear hair plucking (dogs)','+฿50','dog'],['mala','Malaseb medicated bath','One spot +฿50 / Full body +฿100','all'],['deg','Deep degreasing (cats)','One spot +฿100 / Full body +฿500','cat'],['nail','Nail finishing','+฿50','all'],['gland','Anal gland expression','+฿30','all'],['sani','Sanitary trim','Free','all'],['teeth','Tooth brushing','+฿50','all']]},zh:{title:'查看价格',lead:'选择最接近的体重区间。最终以到店确认为准。',pet:'狗或猫',coat:'毛发',weight:'体重',svc:'服务',est:'预估价格',book:'预约',note:'最终价格以到店称重和毛发状况为准。',pets:[['dog','狗狗'],['cat','猫咪']],coats:{dog:[['short','短毛'],['medium','中长'],['long','长毛']],cat:[['single','单层短毛（泰国猫）'],['double','双层毛 / 长毛 / 短而厚']]},catHint:'单层短毛＝像泰国猫一样薄而贴身的毛（只洗澡）· 毛短但浓密/蓬松，请选第二组（价格与长毛相同）。',pickCoat:'请选择毛发类型',catNote:'不含额外费用，例如凶猫、毛结、怕水或怕吹风。',bathOnly:'单层短毛只提供洗澡（不提供剃毛或剪刀修剪）。',svcs:[['bath','只洗澡'],['shave','洗澡 + 剃毛'],['groom','洗澡 + 剪刀修剪']],addonsTitle:'附加服务',addonsLead:'可另选加项，不含在订金内。',addons:[['coat','毛发护理','+฿50','all'],['ear','深层洗耳','+฿50','all'],['pluck','拔耳毛（仅狗狗）','+฿50','dog'],['mala','Malaseb 药浴','一个部位 +฿50 / 全身 +฿100','all'],['deg','深层去油（仅猫）','一个部位 +฿100 / 全身 +฿500','cat'],['nail','修磨甲缘','+฿50','all'],['gland','挤肛门腺','+฿30','all'],['sani','屁屁周围剃毛','免费','all'],['teeth','刷牙','+฿50','all']]}};
let lang='th',pet='dog',coat='short',band=0;
const DEFAULT_COAT={dog:'short',cat:null};
function svcsFor(p,c){return p==='cat'&&c==='single'?['bath']:['bath','shave','groom'];}
function priceOf(p,c,svc,b){const table=p==='dog'?dog:cat;const row=table[c]&&table[c][svc];return row&&row[b]!=null?row[b]:null;}
function draw(){const t=T[lang];document.getElementById('title').textContent=t.title;document.getElementById('lead').textContent=t.lead;document.getElementById('lpet').textContent=t.pet;document.getElementById('lcoat').textContent=t.coat;document.getElementById('lweight').textContent=t.weight;document.getElementById('lsvc').textContent=t.svc;document.getElementById('est').textContent=t.est;document.getElementById('book').textContent=t.book;document.getElementById('note').textContent=t.note;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));document.getElementById('pets').innerHTML=t.pets.map(p=>'<button type="button" data-pet="'+p[0]+'" class="'+(pet===p[0]?'on':'')+'">'+p[1]+'</button>').join('');document.getElementById('coats').innerHTML=t.coats[pet].map(c=>'<button type="button" data-coat="'+c[0]+'" class="'+(coat===c[0]?'on':'')+'">'+c[1]+'</button>').join('');const bands=pet==='dog'?dogBands:catBands;document.getElementById('weights').innerHTML=bands.map((label,i)=>'<button type="button" data-band="'+i+'" class="'+(band===i?'on':'')+'">'+label+'</button>').join('');let hint=document.getElementById('coatHint');if(!hint){hint=document.createElement('p');hint.id='coatHint';hint.className='hint';document.getElementById('coats').insertAdjacentElement('afterend',hint);}hint.textContent=pet==='cat'?t.catHint+(coat==='single'?' '+t.bathOnly:''):'';const sel=document.getElementById('service');const ok=svcsFor(pet,coat);const cur=ok.indexOf(sel.value)>=0?sel.value:'bath';sel.innerHTML=t.svcs.filter(s=>ok.indexOf(s[0])>=0).map(s=>'<option value="'+s[0]+'">'+s[1]+'</option>').join('');sel.value=cur;if(pet==='cat')document.getElementById('note').textContent=t.note+' '+t.catNote;document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{const np=b.dataset.pet;if(np!==pet||!T[lang].coats[np].some(c=>c[0]===coat))coat=DEFAULT_COAT[np];pet=np;band=0;draw();});document.querySelectorAll('[data-coat]').forEach(b=>b.onclick=()=>{coat=b.dataset.coat;draw();});document.querySelectorAll('[data-band]').forEach(b=>b.onclick=()=>{band=+b.dataset.band;draw();});document.getElementById('addonsTitle').textContent=t.addonsTitle;document.getElementById('addonsLead').textContent=t.addonsLead;document.getElementById('addonsList').innerHTML=t.addons.filter(a=>a[3]==='all'||a[3]===pet).map(a=>'<li><b>'+a[1]+'</b> '+a[2]+'</li>').join('');calc();}
function calc(){const el=document.getElementById('price');if(!coat){el.textContent=T[lang].pickCoat;el.classList.add('pending');return;}el.classList.remove('pending');const svc=document.getElementById('service').value||'bath';const v=priceOf(pet,coat,svc,band);el.textContent=v==null?'-':'฿'+v;}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;draw();});document.getElementById('service').onchange=calc;draw();
</script></body></html>
